[package]
name = "deadwax-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Deadwax's collection: the albums, the database and the dev list. No network."

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
