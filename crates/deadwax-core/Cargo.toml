[package]
name = "deadwax-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Deadwax's collection: the albums, the database, the covers on disk, their palettes and the dev list. No network."

[dependencies]
fast_image_resize = { version = "6", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
palette = { version = "0.7.7", default-features = false, features = ["std"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[features]
# Test images for other crates' tests.
testing = []

[dev-dependencies]
tempfile = "3"
