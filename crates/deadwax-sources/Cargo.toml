[package]
name = "deadwax-sources"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Deadwax's web clients: Spotify (with sign-in and rate limits), iTunes, Deezer and MusicBrainz."

[dependencies]
deadwax-core = { path = "../deadwax-core" }
base64 = "0.23"
keyring = "4"
rand = "0.10"
reqwest = { version = "0.13", features = ["json", "form", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
