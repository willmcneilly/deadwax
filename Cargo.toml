[workspace]
resolver = "3"
members = ["crates/*", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

# Tauri's recommended release settings: https://tauri.app/concept/size/
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Decoding and resizing covers is tens of times slower unoptimised, which
# makes the album job queue and its tests crawl in development builds. Only
# these crates are optimised, so the rest still builds quickly. The resizer
# is generic, so most of its code is compiled into `deadwax-core`, which is
# why that's here too. Debug assertions stay on, so the dev list does too.
[profile.dev.package.deadwax-core]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.fast_image_resize]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
