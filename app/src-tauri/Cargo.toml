[package]
name = "deadwax-app"
description = "The Deadwax desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name, which
# otherwise conflicts on Windows (rust-lang/cargo#8519).
name = "deadwax_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
deadwax-core = { path = "../../crates/deadwax-core" }
deadwax-sources = { path = "../../crates/deadwax-sources" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
deadwax-core = { path = "../../crates/deadwax-core", features = ["testing"] }
syn = { version = "2", features = ["full"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
